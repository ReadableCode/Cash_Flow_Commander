# template_providers.yaml — committed shape of providers.local.yaml
#
# Usage:
#   1. Copy this file to providers.local.yaml at the repo root (gitignored).
#   2. Fill in your real values there — account numbers, IDs, local paths.
#   3. NEVER commit providers.local.yaml. This repo is public; only this
#      placeholder template belongs in git.
#
# One top-level key per provider. The key is the provider slug: lowercase
# (a-z, 0-9, '_', '-'), and it must match both the ingest CLI's --provider
# value and the /bills-<slug> command name.
#
# Path fields (archive_dir, raw_dir, data_dir, download_dir) accept:
#   - a repo-relative path      "local/chase"  (resolved against the repo
#     root, so it exists on this machine only)
#   - an absolute path          "/srv/bills"
#   - "~/..." for your home directory
#   - "${ONEDRIVE_DOCS}/..." for a folder inside your OneDrive personal
#     Documents tree. src/user_paths.py resolves that per machine (macOS
#     discovery; set $ONEDRIVE_DOCS anywhere else), so the same config works on
#     every Mac the folder syncs to. Prefer this over an absolute cloud path: a
#     literal "/Users/<you>/Library/CloudStorage/..." pins the whole workflow to
#     one machine and silently finds nothing on any other.

rhythm:
  # Category of service this provider bills for
  # (e.g. electricity, gas, water, internet, insurance).
  service_type: electricity

  # Your account number with the provider, exactly as it appears on bills.
  account_number: ""

  # Provider-specific identifiers beyond the account number — a free-form
  # map. Examples for an electricity provider: premise_id, esi_id, meter_id.
  external_ids: {}

  # Directory where finished PDFs are filed long-term, e.g.
  # "${ONEDRIVE_DOCS}/<utilities folder>/<Provider>".
  archive_dir: ""

  # Archive of verbatim captures (API JSON, raw downloads). Files stay here
  # after ingest. Usually <archive_dir>/raw, e.g.
  # "${ONEDRIVE_DOCS}/<utilities folder>/<Provider>/raw".
  raw_dir: ""

  # Directory for derived CSV exports, if any. Optional; leave "" if unused.
  data_dir: ""

  # Where this machine's browser drops this portal's downloads. Captures are
  # moved out of it into raw_dir or archive_dir as they land, so after a run it
  # holds no file whose name starts with this provider's slug.
  download_dir: ""

  # Free text: browser/download quirks, login gotchas, contract history,
  # billing cadence, anything the /bills-<slug> command should know.
  notes: |

gexa:
  service_type: electricity

  # Your account number with the provider, exactly as it appears on bills.
  account_number: ""

  # Free-form identifiers, e.g. esi_id, meter_number.
  external_ids: {}

  archive_dir: ""
  raw_dir: ""
  data_dir: ""

  # Where this machine's browser drops this portal's downloads.
  download_dir: ""

  # Required. The delivery utility's fixed charge per billing cycle, in dollars,
  # keyed by the date it took effect (YYYY-MM-DD). The bill prints delivery as
  # one lump sum, and the parser subtracts this charge to find the per-kWh
  # part; without an entry in effect for a bill, that bill fails to parse. The
  # provider publishes the current charge for each delivery utility on its
  # TDU charges page. Add a new line when it changes; never edit an old one.
  tdu_fixed_monthly_charges: {}
    # "2026-01-01": "0.00"

  notes: |

smt:
  # Smart Meter Texas: the meter's 15-minute consumption and generation. A
  # data source, not a biller. It has its own entry because the series is a
  # property of the meter, not of whoever is currently selling the power, and
  # a change of retail provider must not move it.
  service_type: electricity_meter

  # The ESI ID. parse_raw.py uses account_number as usage_intervals.account_id,
  # so this is the account the meter's series is filed under.
  account_number: ""

  # Free-form identifiers, e.g. meter_number.
  external_ids: {}

  # This provider's own folder. Never a folder inside a retail provider's
  # archive_dir: that provider's ingest would walk it and claim the exports.
  archive_dir: ""
  raw_dir: ""
  data_dir: ""

  # Where this machine's browser drops the export. It is always named
  # IntervalData.csv, which does not carry the slug until it is renamed.
  download_dir: ""

  notes: |

enphase_enlighten:
  # Enphase Enlighten: gross solar production at the inverters. A data source,
  # not a biller.
  service_type: solar_production

  # Enphase has no account number; the system id is the account identity.
  # parse_raw.py uses account_number as usage_intervals.account_id, and the
  # series is kept on its own account rather than a retail provider's:
  # production is a property of the roof.
  account_number: ""

  external_ids:
    system_id: ""

  archive_dir: ""
  raw_dir: ""
  data_dir: ""

  # Where this machine's browser drops this portal's downloads.
  download_dir: ""

  notes: |

chase:
  # Chase transactions are not a utility bill; this provider feeds
  # transaction_downloader/ rather than the usage/bills tables.
  service_type: banking

  # Unused for Chase — accounts are listed under external_ids.accounts below,
  # because a single login covers several accounts. Leave blank.
  account_number: ""

  # Map each account's last 4 digits to a label and a kind (bank | credit).
  #
  # The 24-month export retention floor applies to BOTH kinds (verified live
  # 2026-08-22 — an earlier reading that cards were unbounded was a false
  # negative). `kind` is informational: cards additionally offer
  # statement-cycle exports, and their exports carry two date columns.
  # A bare string (`"0000": "Checking"`) still works and defaults to `bank`.
  #
  # Only accounts Chase offers a CSV export for belong here. Investment and
  # loan accounts appear on the dashboard but are absent from the export form.
  external_ids:
    accounts:
      "0000": {label: "Checking", kind: bank}
      "1111": {label: "Savings", kind: bank}
      "2222": {label: "Credit Card", kind: credit}

  # Where this machine's browser drops Chase downloads. Card exports embed the
  # requested window in the filename and bank exports do not, so never read
  # the window from the name. A run claims its download with src/downloads.py.
  download_dir: ""

  # Where downloaded statements/PDFs are filed long-term. Optional for Chase.
  archive_dir: ""

  # Archive of verbatim CSV captures, window markers and the capture manifest.
  # Required. Files stay here after ingest: transaction_downloader/plan.py
  # reads it when the database is unreachable, and it is the copy a person can
  # open. Keep it in the synced documents tree so every machine has it, e.g.
  # "${ONEDRIVE_DOCS}/<banking folder>/Chase/raw".
  raw_dir: ""

  # Work directory. It holds no captures and ingest does not walk it, but
  # transaction_downloader/land.sh requires it and creates it, e.g.
  # "${ONEDRIVE_DOCS}/<banking folder>/Chase/data".
  data_dir: ""

  # Earliest month to backfill, YYYY-MM. Omit to go back 24 months on a first
  # run. A long backfill is chunked newest-first across several runs.
  backfill_start: ""

  # Free text: which accounts export how far back, anything
  # /transactions-chase should know. Useful things to record here:
  #   - where archived pre-24-month exports live, for `capture.py import-legacy`
  #   - any account whose export behaves unusually
  notes: |

citi:
  # Citi credit-card transactions; feeds transaction_downloader/ (with
  # --provider citi) rather than the usage/bills tables.
  service_type: banking

  # Unused for Citi — accounts are listed under external_ids.accounts below,
  # because a single login can cover several cards. Leave blank.
  account_number: ""

  # Map each card's last 4 digits to a label. `kind` is always credit here.
  # `internal_id` is the accountId guid in the card-dashboard URL — the last 4
  # appears only in the nav link text, so recording the guid saves a lookup.
  external_ids:
    accounts:
      "0000": {label: "Card Name", kind: credit, internal_id: ""}

  # Where this machine's browser drops Citi downloads. Citi names downloads by
  # scope label ("Date range.CSV"), so capture.py can never infer the account
  # from the filename — always pass --account when filing.
  download_dir: ""

  # Only raw_dir holds captures. transaction_downloader/land.sh passes ingest
  # raw_dir, plus archive_dir when that is set, and never data_dir.
  #
  # Where downloaded statements/PDFs are filed long-term. Optional — this
  # provider has no bill PDFs to file, and pointing it at a correspondence
  # folder makes ingest re-walk unrelated documents every run.
  archive_dir: ""

  # Archive of verbatim CSV captures, window markers and the capture manifest.
  # Required. Files stay here after ingest: plan.py reads it when the database
  # is unreachable, and it is the copy a person can open. Keep it in the synced
  # documents tree, e.g. "${ONEDRIVE_DOCS}/<banking folder>/Citi/raw".
  raw_dir: ""

  # Work directory. It holds no captures and ingest does not walk it, but
  # land.sh requires it and creates it, e.g.
  # "${ONEDRIVE_DOCS}/<banking folder>/Citi/data".
  data_dir: ""

  # Earliest month to backfill, YYYY-MM. Set it explicitly when the goal is
  # "all of it" — without it the planner anchors to the oldest existing
  # capture, and one stray capture can silently suppress a whole backfill.
  backfill_start: ""

  # Free text: retention floor as last observed (it is a statement-cycle
  # boundary ~24 months back, and moves with the statement calendar), pending
  # card conversions, anything /transactions-citi should know.
  notes: |

elan:
  # Elan Financial Services credit card (myaccountaccess.com — Elan
  # white-labels cards for many banks and credit unions); feeds
  # transaction_downloader/ (with --provider elan) rather than the
  # usage/bills tables.
  service_type: banking

  # Unused for Elan — accounts are listed under external_ids.accounts below,
  # because a single login can cover several cards. Leave blank.
  account_number: ""

  # Map each card's last 4 digits to a label. `kind` is always credit here.
  external_ids:
    accounts:
      "0000": {label: "Card Name", kind: credit}

  # Where this machine's browser drops Elan downloads. Filenames embed the
  # label and last 4 but NOT the requested end date, so never read the window
  # from the name. A run claims its download with src/downloads.py.
  download_dir: ""

  # Only raw_dir holds captures. transaction_downloader/land.sh passes ingest
  # raw_dir, plus archive_dir when that is set, and never data_dir.
  #
  # Where downloaded statements/PDFs are filed long-term. Optional — this
  # provider has no bill PDFs to file, and pointing it at a correspondence
  # folder makes ingest re-walk unrelated documents every run.
  archive_dir: ""

  # Archive of verbatim CSV captures, window markers and the capture manifest.
  # Required. Files stay here after ingest: plan.py reads it when the database
  # is unreachable, and it is the copy a person can open. Keep it in the synced
  # documents tree, e.g. "${ONEDRIVE_DOCS}/<banking folder>/Elan/raw".
  raw_dir: ""

  # Work directory. It holds no captures and ingest does not walk it, but
  # land.sh requires it and creates it, e.g.
  # "${ONEDRIVE_DOCS}/<banking folder>/Elan/data".
  data_dir: ""

  # Earliest month to backfill, YYYY-MM. Set it explicitly when the goal is
  # "all of it" — without it the planner anchors to the oldest existing
  # capture, and one stray capture can silently suppress a whole backfill.
  backfill_start: ""

  # Free text: retention behavior as observed (18-month floor, silently
  # clamped rather than refused), anything /transactions-elan should know.
  notes: |

# Expected-transaction config (src/expected_import_sheet.py, src/cfc_tui.py).
# Maps your sheet's account labels onto transactions.account_id values so the
# import and the pairing TUI know which account a bill usually moves through.
our_cash:
  # Sheet Auto_Pay_Account label -> transactions.account_id (last 4).
  account_aliases: {}
    # "My Bank": "1234"

  # Transfer series name -> the account the other leg lands on (card payoffs,
  # savings transfers). Legs on this account are excluded from the paid-net.
  transfer_accounts: {}
    # "My Card Payoff": "5678"

  # Account whose bank-export running balance anchors the cash forecast
  # (src/expected_forecast.py), as transactions.account_id.
  forecast_anchor_account: ""

  # Six months of essential expenses, as a positive dollar amount. Drawn on
  # the forecast dashboard; the daily balance should always end above it.
  emergency_fund: 0
